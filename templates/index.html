<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>갤창랭킹</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >
</head>

<body>
    <div class="container">

        <h1>갤창랭킹</h1>

        <div class="search-box">

            <input
                type="text"
                id="urlInput"
                placeholder="URL 입력"
            >

            <button id="searchBtn">

                <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="20"
                    height="20"
                    fill="none"
                    viewBox="0 0 24 24"
                    stroke="currentColor"
                    stroke-width="2"
                >
                    <circle
                        cx="11"
                        cy="11"
                        r="7"
                    ></circle>

                    <line
                        x1="16.65"
                        y1="16.65"
                        x2="21"
                        y2="21"
                    ></line>

                </svg>

            </button>

        </div>

        <div id="result"></div>

    </div>

    <script
        src="{{ url_for('static', filename='app.js') }}"
    ></script>

</body>
</html>
