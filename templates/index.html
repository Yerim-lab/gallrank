<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>갤창랭킹</title>
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

<div class="app">

    <div class="title">갤창랭킹</div>

    <div class="search">
        <input id="urlInput" placeholder="갤러리 URL 입력">

        <button onclick="runCrawl()">
            <svg viewBox="0 0 24 24" class="icon">
                <path d="M10 18a8 8 0 1 1 0-16 8 8 0 0 1 0 16zm11 3-6-6"/>
            </svg>

            <div class="dots">
                <span></span><span></span><span></span>
            </div>
        </button>
    </div>

    <div id="result" class="hidden">

        <div class="header">
            <div id="meta"></div>
            <button onclick="copy()">copy</button>
        </div>

        <table>
            <thead>
                <tr>
                    <th>순위</th>
                    <th>닉네임</th>
                    <th>글수</th>
                    <th>지분</th>
                </tr>
            </thead>
            <tbody id="tbody"></tbody>
        </table>

    </div>

</div>

<script src="/static/app.js"></script>

</body>
</html>
