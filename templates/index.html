<!DOCTYPE html>
<html lang="ko">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>갤창랭킹</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}?v=10"
    >

</head>

<body>

<div class="wrapper">

    <h1 class="title">
        갤창랭킹
    </h1>

    <div class="search-box">

        <input
            id="urlInput"
            type="text"
            placeholder="URL 입력"
            autocomplete="off"
        >

        <div class="divider"></div>

        <button
            id="pasteBtn"
            class="icon-btn"
            type="button"
        >

            <svg
                class="icon-svg"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
            >
                <rect
                    x="9"
                    y="9"
                    width="13"
                    height="13"
                    rx="2"
                ></rect>

                <path
                    d="M5 15V5a2 2 0 0 1 2-2h10"
                ></path>
            </svg>

        </button>

        <button
            id="searchBtn"
            class="search-btn"
            type="button"
        >

            <span
                class="icon"
                id="searchIcon"
            >

                <svg
                    class="icon-svg"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                >
                    <circle
                        cx="11"
                        cy="11"
                        r="7"
                    ></circle>

                    <line
                        x1="16.65"
                        y1="16.65"
                        x2="21"
                        y2="21"
                    ></line>
                </svg>

            </span>

            <div
                class="dots"
                id="loadingDots"
            >
                <span></span>
                <span></span>
                <span></span>
            </div>

        </button>

    </div>

    <div id="result"></div>

</div>

<script
    src="{{ url_for('static', filename='app.js') }}?v=10"
></script>

</body>
</html>
