<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>갤창랭킹</title>

    <link rel="icon" href="/static/favicon.png">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="app">

    <div class="title">갤창랭킹</div>

    <div class="search-wrapper">

        <div class="search-box">

            <input id="urlInput" class="search-input" placeholder="갤러리 URL 입력">

            <button class="search-btn" onclick="runCrawl()">

                <svg class="icon-search" viewBox="0 0 24 24">
                    <path d="M10 18a8 8 0 1 1 0-16 8 8 0 0 1 0 16zm11 3-6-6"/>
                </svg>

                <div class="loading-dots">
                    <span></span><span></span><span></span>
                </div>

            </button>

        </div>

    </div>

    <div id="resultBox" class="result-box hidden">

        <div class="result-header">
            <div id="metaInfo"></div>
            <button class="copy-btn" onclick="copyResult()">copy</button>
        </div>

        <table>
            <thead>
                <tr>
                    <th>순위</th>
                    <th>닉네임</th>
                    <th>글수</th>
                    <th>지분</th>
                </tr>
            </thead>
            <tbody id="resultBody"></tbody>
        </table>

    </div>

</div>

<script src="{{ url_for('static', filename='app.js') }}"></script>

</body>
</html>
