<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>갤창랭킹</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="wrapper">

    <h1 class="title">갤창랭킹</h1>

    <!-- 검색 영역 -->
    <div class="search-box">

        <input id="urlInput" type="text" placeholder="URL 입력">

        <div class="divider"></div>

        <button id="pasteBtn" class="icon-btn">📋</button>

        <button id="searchBtn" class="icon-btn search-btn">
            <span class="icon">🔍</span>

            <div class="dots hidden" id="loadingDots">
                <span></span><span></span><span></span>
            </div>
        </button>

    </div>

    <!-- 결과 영역 -->
    <div id="result"></div>

</div>

<script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
