<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>갤창랭킹</title>

    <link rel="icon" href="/static/favicon.png" type="image/png">

    <script async src="https://pagead2.googletagmanager.com/gtag/js?id=AW-18190141007"></script>

<body>

<div class="container">

    <h1>갤창랭킹</h1>

    <div class="search-bar">

        <input
            type="text"
            id="urlInput"
            placeholder="갤러리 URL 입력"
            autocomplete="off"
        >

        <button id="pasteBtn" type="button">붙여넣기</button>
        <button id="searchBtn" type="button">검색</button>

    </div>

    <!-- 결과 영역 -->
    <div id="result">
        <table class="result-table">
            <thead>
                <tr>
                    <th>순위</th>
                    <th>닉네임</th>
                    <th>UID</th>
                    <th>글 수</th>
                    <th>비율</th>
                </tr>
            </thead>
            <tbody id="resultBody">
                <!-- JS가 여기에 삽입 -->
            </tbody>
        </table>
    </div>

</div>

<!-- JS -->
<script src="/static/app.js?v=777"></script>

</body>
</html>
