<!DOCTYPE html>
<html lang="ko">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>갤창랭킹</title>

    <link
        rel="stylesheet"
        href="/static/style.css?v=999"
    >

</head>

<body>

    <div class="container">

        <h1>갤창랭킹</h1>

        <div class="search-bar">

            <input
                type="text"
                id="urlInput"
                placeholder="URL 입력"
                autocomplete="off"
            >

            <div class="divider"></div>

            <button
                id="pasteBtn"
                type="button"
            >

                <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="20"
                    height="20"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                >
                    <rect
                        x="9"
                        y="9"
                        width="13"
                        height="13"
                        rx="2"
                    ></rect>

                    <path
                        d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"
                    ></path>

                </svg>

            </button>

            <div class="divider"></div>

            <button
                id="searchBtn"
                type="button"
            >

                <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="20"
                    height="20"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                >
                    <circle
                        cx="11"
                        cy="11"
                        r="7"
                    ></circle>

                    <line
                        x1="16.65"
                        y1="16.65"
                        x2="21"
                        y2="21"
                    ></line>

                </svg>

            </button>

        </div>

        <div id="result"></div>

    </div>

    <script src="/static/app.js?v=999"></script>

</body>
</html>
