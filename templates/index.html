<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>갤창랭킹</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}?v=7"
    >
</head>

<body>

<div class="wrapper">

    <h1 class="title">갤창랭킹</h1>

    <div class="search-box">

        <input
            id="urlInput"
            type="text"
            placeholder="URL 입력"
            autocomplete="off"
        >

        <div class="divider"></div>

        <button
            id="pasteBtn"
            class="icon-btn"
            type="button"
        >
            📋
        </button>

        <button
            id="searchBtn"
            class="search-btn"
            type="button"
        >

            <span
                class="icon"
                id="searchIcon"
            >
                🔍
            </span>

            <div
                class="dots"
                id="loadingDots"
            >
                <span></span>
                <span></span>
                <span></span>
            </div>

        </button>

    </div>

    <div id="result"></div>

</div>

<script
    src="{{ url_for('static', filename='app.js') }}?v=7"
></script>

</body>
</html>
